<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Learning Web">
<meta name="theme-color" content="#0B1030">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<title>Our Learning Web ✨</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#2B3040; --paper:#FFF9EF; --sun:#FFC93C; --spark:#FFE94A;
    --go:#37B45F; --go-dark:#238746; --sky:#CDEBFF; --boom:#FF7A1A;
    --car:#E8503A; --car-dark:#C13A28; --blue:#5FA8E8; --fuel:#F5A623;
    --space1:#0B1030; --space2:#1B2559; --metal:#9AA7B8; --metal-dark:#5E6B7C;
    --grass:#8ED081;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-touch-callout:none;}
  html,body{margin:0; height:100%;}
  body{
    font-family:'Nunito',system-ui,sans-serif; background:var(--space1); color:var(--ink);
    display:flex; flex-direction:column; overflow:hidden; user-select:none; -webkit-user-select:none;
    touch-action:manipulation; height:100vh; height:100dvh; overscroll-behavior:none;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  button{font-family:'Baloo 2',cursive;}
  /* ============ TREE SCREEN ============ */
  #treeScreen{position:fixed; inset:0; display:flex; flex-direction:column;}
  #treeCanvas{position:absolute; inset:0; width:100%; height:100%; touch-action:none;}
  #treeHud{position:relative; z-index:2; display:flex; align-items:center; justify-content:space-between; padding:12px 18px; pointer-events:none;}
  #treeHud h1{
    font-family:'Baloo 2',cursive; font-weight:800; margin:0; color:#fff;
    font-size:clamp(19px,3.4vw,30px); text-shadow:0 3px 0 rgba(0,0,0,.35); letter-spacing:.5px;
  }
  #treeHud .hudRight{display:flex; gap:10px; align-items:center; pointer-events:auto;}
  #starCount{
    font-family:'Baloo 2',cursive; font-weight:800; color:var(--ink); background:var(--spark);
    border:3px solid var(--ink); border-radius:999px; padding:6px 16px; font-size:clamp(14px,2vw,19px);
    box-shadow:0 3px 0 var(--ink);
  }
  .roundBtn{
    font-size:20px; background:#fff; border:3px solid var(--ink); border-radius:50%;
    width:46px; height:46px; cursor:pointer; box-shadow:0 3px 0 var(--ink);
  }
  .roundBtn:active{transform:translateY(2px); box-shadow:0 1px 0 var(--ink);}
  #treeHint{
    position:absolute; bottom:calc(14px + env(safe-area-inset-bottom)); left:0; right:0; text-align:center; z-index:2; pointer-events:none;
    font-family:'Baloo 2',cursive; font-weight:800; color:#BFD3FF; font-size:clamp(14px,2vw,19px);
    text-shadow:0 2px 4px rgba(0,0,0,.5);
  }
  #nodeCard{
    position:absolute; left:50%; transform:translateX(-50%); bottom:calc(52px + env(safe-area-inset-bottom));
    z-index:3; background:var(--paper); border:4px solid var(--ink); border-radius:20px;
    padding:12px 18px; max-width:min(92vw,460px); text-align:center; box-shadow:0 6px 0 rgba(0,0,0,.45);
    display:none;
  }
  #nodeCard.show{display:block;}
  #nodeCard h3{font-family:'Baloo 2',cursive; font-weight:800; margin:0 0 4px; font-size:clamp(17px,2.6vw,23px);}
  #nodeCard p{margin:0 0 10px; font-weight:700; font-size:clamp(12px,1.8vw,15px); color:#54607a;}
  #nodeCard .bigBtn{margin:0 4px;}
  /* ============ SHARED BUTTONS ============ */
  .bigBtn{
    font-family:'Baloo 2',cursive; font-weight:800; font-size:clamp(16px,2.4vw,23px);
    padding:10px 26px; border-radius:999px; border:4px solid var(--ink);
    background:var(--sun); color:var(--ink); cursor:pointer;
    box-shadow:0 5px 0 var(--ink); transition:transform .08s;
  }
  .bigBtn:active,.bigBtn.held{transform:translateY(4px); box-shadow:0 1px 0 var(--ink);}
  .bigBtn.go{background:var(--go); color:#fff; text-shadow:0 2px 0 var(--go-dark);}
  .bigBtn.boom{background:var(--boom); color:#fff; text-shadow:0 2px 0 #b34e00;}
  .bigBtn.blue{background:var(--blue); color:#fff; text-shadow:0 2px 0 #33689c;}
  .bigBtn.ghost{background:#fff;}
  .toggleChip{
    font-family:'Baloo 2',cursive; font-weight:800; font-size:clamp(14px,2vw,19px);
    padding:8px 18px; border-radius:999px; border:3px solid var(--ink); background:#fff; cursor:pointer; opacity:.55;
  }
  .toggleChip.on{opacity:1; background:var(--spark); box-shadow:0 3px 0 var(--ink);}
  /* ============ LESSON SCREEN ============ */
  #lessonScreen{position:fixed; inset:0; display:none; flex-direction:column; background:var(--sky); z-index:10;}
  #lessonScreen.show{display:flex;}
  #lessonHeader{display:flex; align-items:center; justify-content:space-between; padding:10px 16px 0; gap:10px;}
  #lessonHeader h1{
    font-family:'Baloo 2',cursive; font-weight:800; font-size:clamp(16px,2.8vw,26px);
    margin:0; color:var(--ink); letter-spacing:.4px; flex:1; text-align:center;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  #lessonMain{flex:1; display:grid; grid-template-rows:1fr auto; min-height:0; padding:6px 14px;}
  #sceneWrap{min-height:0; display:flex; align-items:center; justify-content:center;}
  #sceneWrap svg{width:100%; height:100%; max-height:56vh; max-height:56dvh;}
  #captionArea{text-align:center; padding:2px 10px 6px; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch;}
  #kidLine{
    font-family:'Baloo 2',cursive; font-weight:800; margin:0;
    font-size:clamp(20px,3.6vw,34px); line-height:1.15;
  }
  #closerBox{
    margin:6px auto 8px; max-width:760px; font-weight:700;
    font-size:clamp(12px,1.8vw,16px); color:#54607a;
    background:var(--paper); border-radius:14px; padding:8px 14px; border:2px dashed #d8c9a8;
  }
  #closerBox b{color:var(--car-dark);}
  #controlsRow{display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin-top:4px; align-items:center;}
  #lessonNav{display:flex; align-items:center; justify-content:space-between; padding:8px 18px 14px; gap:12px;}
  .navBtn{
    font-family:'Baloo 2',cursive; font-weight:800; font-size:clamp(15px,2.4vw,22px);
    padding:9px 24px; border-radius:999px; border:4px solid var(--ink);
    background:#fff; cursor:pointer; box-shadow:0 4px 0 var(--ink); min-width:110px;
  }
  .navBtn:active{transform:translateY(3px); box-shadow:0 1px 0 var(--ink);}
  .navBtn:disabled{opacity:.25; pointer-events:none;}
  .navBtn.next{background:var(--car); color:#fff;}
  .navBtn.finish{background:var(--sun);}
  #stageDots{display:flex; gap:8px;}
  #stageDots span{width:14px; height:14px; border-radius:50%; background:#fff; border:3px solid var(--ink); transition:.2s;}
  #stageDots span.on{background:var(--car); transform:scale(1.25);}
  /* ============ ASK PANEL & HINTS ============ */
  #askPanel{
    position:fixed; inset:0; z-index:40; display:none; align-items:flex-end; justify-content:center;
    background:rgba(11,16,48,.45);
  }
  #askPanel.show{display:flex;}
  #askCard{
    background:var(--paper); border:4px solid var(--ink); border-radius:24px 24px 0 0; width:min(100vw,720px);
    padding:16px 20px calc(18px + env(safe-area-inset-bottom)); box-shadow:0 -6px 0 rgba(0,0,0,.35);
    max-height:70vh; overflow-y:auto; animation:slideUp .3s ease;
  }
  @keyframes slideUp{from{transform:translateY(60%)}to{transform:translateY(0)}}
  #askAnswer{
    font-weight:700; color:#54607a; background:#fff; border:2px dashed #d8c9a8; border-radius:14px;
    padding:10px 14px; margin:12px 0; font-size:clamp(14px,2vw,17px); min-height:24px; display:none;
  }
  #askAnswer.show{display:block;}
  #askChips{display:flex; flex-wrap:wrap; gap:10px;}
  .qaChip{
    font-family:'Baloo 2',cursive; font-weight:800; font-size:clamp(13px,1.9vw,17px);
    padding:9px 16px; border-radius:999px; border:3px solid var(--ink); background:var(--spark);
    cursor:pointer; box-shadow:0 3px 0 var(--ink);
  }
  .qaChip:active{transform:translateY(2px); box-shadow:0 1px 0 var(--ink);}
  #hintHand{
    position:fixed; z-index:60; font-size:40px; pointer-events:none; display:none;
    animation:hintBob .9s ease-in-out infinite; filter:drop-shadow(0 3px 4px rgba(0,0,0,.4));
  }
  @keyframes hintBob{0%,100%{transform:translateY(0) rotate(-8deg)}50%{transform:translateY(-16px) rotate(8deg)}}
  @keyframes fadeIn{from{opacity:0}}
  /* ============ CELEBRATION ============ */
  #celebrate{
    position:fixed; inset:0; z-index:50; display:none; align-items:center; justify-content:center;
    background:rgba(11,16,48,.75); backdrop-filter:blur(3px);
  }
  #celebrate.show{display:flex;}
  #celebrateCard{
    background:var(--paper); border:5px solid var(--ink); border-radius:26px; text-align:center;
    padding:26px 34px; max-width:min(92vw,480px); box-shadow:0 8px 0 rgba(0,0,0,.5);
    animation:popIn .4s cubic-bezier(.2,1.6,.4,1);
  }
  #celebrateCard .star{font-size:70px; display:block; animation:starSpin 1s ease;}
  #celebrateCard h2{font-family:'Baloo 2',cursive; font-weight:800; margin:6px 0 4px; font-size:clamp(22px,4vw,32px);}
  #celebrateCard p{font-weight:700; color:#54607a; margin:0 0 16px;}
  @keyframes popIn{from{transform:scale(.4); opacity:0} to{transform:scale(1); opacity:1}}
  @keyframes starSpin{from{transform:scale(0) rotate(-360deg)} to{transform:scale(1) rotate(0)}}
  .confettiBit{position:fixed; z-index:49; font-size:26px; pointer-events:none; animation:confFall linear forwards;}
  @keyframes confFall{to{transform:translateY(110vh) rotate(720deg); opacity:.9;}}
  /* ============ shared anims ============ */
  @keyframes bounce{0%,100%{transform:translateY(0)}30%{transform:translateY(-26px)}55%{transform:translateY(0)}75%{transform:translateY(-10px)}}
  .bouncing{animation:bounce .65s ease;}
  @keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-14deg)}75%{transform:rotate(14deg)}}
  .wiggling{animation:wiggle .5s ease;}
  .chip4{
    display:inline-flex; flex-direction:column; align-items:center; gap:2px;
    font-family:'Baloo 2',cursive; font-weight:800; font-size:clamp(11px,1.7vw,16px);
    padding:5px 11px; border-radius:14px; border:3px solid var(--ink); background:#fff; opacity:.4; transition:.15s;
  }
  .chip4 .em{font-size:clamp(18px,3vw,28px);}
  .chip4.lit{opacity:1; background:var(--spark); transform:scale(1.12);}
  @media (max-width:700px){
    #sceneWrap svg{max-height:42vh; max-height:42dvh;}
    .bigBtn{padding:9px 20px; border-width:3px;}
    .navBtn{min-width:88px; padding:8px 14px; border-width:3px;}
    #stageDots{gap:6px;} #stageDots span{width:11px; height:11px; border-width:2px;}
    .roundBtn{width:40px; height:40px; font-size:17px;}
  }
  @media (max-height:520px){
    #sceneWrap svg{max-height:38vh;}
    #kidLine{font-size:19px;}
    #closerBox{font-size:11px; padding:4px 10px; margin:3px auto 4px;}
    .bigBtn{font-size:15px; padding:7px 16px;}
    .navBtn{font-size:14px; padding:6px 12px; min-width:80px;}
  }
  @media (prefers-reduced-motion: reduce){ .bouncing,.wiggling{animation-duration:.01s;} }
</style>
</head>
<body>
<!-- ================= TREE SCREEN ================= -->
<div id="treeScreen">
  <canvas id="treeCanvas"></canvas>
  <div id="treeHud">
    <h1>Our Learning Web ✨</h1>
    <div class="hudRight">
      <span id="starCount">⭐ 0/12</span>
      <button class="roundBtn" id="homeBtn" title="Fly back home">🏠</button>
      <button class="roundBtn" id="soundBtn" title="Sound on/off">🔊</button>
    </div>
  </div>
  <div id="nodeCard">
    <h3 id="cardTitle"></h3>
    <p id="cardDesc"></p>
    <div id="cardBtns"></div>
  </div>
  <div id="treeHint">Drag to glide around 🗺️ · Zoom into a lesson bubble and it opens!</div>
</div>
<!-- ================= LESSON SCREEN ================= -->
<div id="lessonScreen">
  <div id="lessonHeader">
    <button class="roundBtn" id="backToTreeBtn" title="Back to the web">🕸️</button>
    <h1 id="lessonTitle">Lesson</h1>
    <button class="roundBtn" id="teachBtn" title="Teacher, explain this!">🧑‍🏫</button>
    <button class="roundBtn" id="askBtn" title="Ask a question">❓</button>
    <button class="roundBtn" id="soundBtn2" title="Sound on/off">🔊</button>
  </div>
  <div id="lessonMain">
    <div id="sceneWrap"></div>
    <div id="captionArea">
      <h2 id="kidLine"></h2>
      <div id="closerBox"></div>
      <div id="controlsRow"></div>
    </div>
  </div>
  <div id="lessonNav">
    <button class="navBtn" id="stageBackBtn">◀ Back</button>
    <button class="navBtn" id="stageResetBtn" title="Start this page over" style="min-width:0;padding:9px 16px;">↺</button>
    <div id="stageDots"></div>
    <button class="navBtn next" id="stageNextBtn">Next ▶</button>
  </div>
</div>
<!-- ================= ASK THE TEACHER ================= -->
<div id="askPanel">
  <div id="askCard">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;">
      <h3 style="font-family:'Baloo 2',cursive;font-weight:800;margin:0;font-size:clamp(18px,2.6vw,24px);">🧑‍🏫 Ask the teacher!</h3>
      <button class="roundBtn" id="askClose" style="width:38px;height:38px;font-size:16px;">✖</button>
    </div>
    <div id="askAnswer"></div>
    <div id="askChips"></div>
  </div>
</div>
<div id="hintHand">👆</div>
<!-- ================= CELEBRATION ================= -->
<div id="celebrate">
  <div id="celebrateCard">
    <span class="star">⭐</span>
    <h2 id="celebrateTitle">You did it!</h2>
    <p id="celebrateDesc">A new star shines on your tree!</p>
    <div>
      <button class="bigBtn go" id="celebTreeBtn">🌳 Back to the tree</button>
      <button class="bigBtn" id="celebNextBtn" style="display:none;">Next ▶</button>
    </div>
  </div>
</div>
<script>
(function(){
"use strict";
/* ================================================================
   SOUND
================================================================ */
let audioCtx=null, muted=false;
function syncSoundBtns(){ document.getElementById('soundBtn').textContent = muted?'🔇':'🔊';
  document.getElementById('soundBtn2').textContent = muted?'🔇':'🔊'; }
['soundBtn','soundBtn2'].forEach(id=>document.getElementById(id).addEventListener('click',()=>{muted=!muted; syncSoundBtns();}));
function ctx(){
  if(!audioCtx){ try{audioCtx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){} }
  if(audioCtx && audioCtx.state==='suspended'){ try{audioCtx.resume();}catch(e){} }
  return audioCtx;
}
document.addEventListener('pointerdown',function unlock(){ ctx(); },{passive:true});
function tone(freq,dur,type,vol,slideTo){
  if(muted) return; const c=ctx(); if(!c) return;
  try{
    const o=c.createOscillator(), g=c.createGain();
    o.type=type||'sine'; o.frequency.value=freq;
    if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo,c.currentTime+dur);
    g.gain.setValueAtTime(vol||0.15,c.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,c.currentTime+dur);
    o.connect(g); g.connect(c.destination); o.start(); o.stop(c.currentTime+dur);
  }catch(e){}
}
const S={
  tone:tone,
  pop:()=>tone(600,.09,'sine',.12,900),
  ding:()=>{tone(880,.12,'sine',.12); setTimeout(()=>tone(1320,.25,'sine',.12),110);},
  boom:()=>tone(130,.3,'triangle',.22,45),
  honk:()=>{tone(440,.18,'square',.1); setTimeout(()=>tone(554,.22,'square',.1),140);},
  whir:()=>tone(220,.05,'sine',.05),
  slide:()=>tone(320,.4,'sawtooth',.05,180),
  tada:()=>{[523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,.28,'triangle',.14),i*130));},
  woosh:()=>tone(200,.35,'sine',.08,700),
  thud:()=>tone(90,.15,'triangle',.18,60)
};
/* ---------- teacher voice (browser text-to-speech) ---------- */
function stripHTML(s){ const d=document.createElement('div'); d.innerHTML=s||''; return d.textContent||''; }
function speak(txt){
  try{
    if(muted || !window.speechSynthesis || !window.SpeechSynthesisUtterance) return false;
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(txt);
    u.rate=0.95; u.pitch=1.05;
    const vs=speechSynthesis.getVoices();
    const v=vs.find(v=>/en/i.test(v.lang)&&/female|zira|samantha|karen|google us/i.test(v.name))||vs.find(v=>/en/i.test(v.lang));
    if(v) u.voice=v;
    speechSynthesis.speak(u);
    return true;
  }catch(e){ return false; }
}
function hushTeacher(){ try{ if(window.speechSynthesis) speechSynthesis.cancel(); }catch(e){} }
/* ================================================================
   PROGRESS  (localStorage with in-memory fallback)
================================================================ */
const PKEY='learningTree.v1';
let memStore={};
function loadProgress(){ try{ const s=localStorage.getItem(PKEY); return s?JSON.parse(s):{}; }catch(e){ return memStore; } }
function saveProgress(p){ try{ localStorage.setItem(PKEY,JSON.stringify(p)); }catch(e){ memStore=p; } }
let progress=loadProgress();
function starTotal(){ return Object.keys(progress).filter(k=>progress[k]).length; }
function starMax(){ return TOPICS.reduce((s,t)=>s+t.sections.length,0); }
function updateStarHud(){ document.getElementById('starCount').textContent='⭐ '+starTotal()+'/'+starMax(); }
/* ================================================================
   TOPIC / CHAPTER DATA  (2D map — labels are topic names, not numbers)
================================================================ */
const TOPICS=[
  {chNum:3, id:'addsub',  label:'Addition & Subtraction',   short:'Add · Subtract',  emoji:'🍎', color:'#37B45F',
   desc:'Putting together, taking apart, and the big idea that connects them.', pos:[-520,430], ringR:265, sections:[
    {id:'s1', num:'3.1', title:'What Adding Is',       emoji:'🍎'},
    {id:'s2', num:'3.2', title:'Any Order Works',      emoji:'🚂'},
    {id:'s3', num:'3.3', title:'Taking Away',          emoji:'🍪'},
    {id:'s4', num:'3.4', title:'Fact Families',        emoji:'🔺'},
    {id:'s5', num:'3.5', title:'2-Digit Addition',     emoji:'🧱'},
    {id:'s6', num:'3.6', title:'2-Digit Subtraction',  emoji:'🔁'},
    {id:'s7', num:'3.7', title:'Mental Math Tricks',   emoji:'🧠'},
    {id:'s8', num:'3.8', title:'Word Problems',        emoji:'📖'},
    {id:'s9', num:'3.9', title:'Adding on Graphs',     emoji:'📈'},
    {id:'s10',num:'3.10',title:'Money & Real Life',    emoji:'🌍'}
  ]},
  {chNum:4, id:'muldiv',  label:'Multiplication & Division', short:'Multiply · Divide', emoji:'🍪', color:'#5FA8E8',
   desc:'Adding in big jumps, and sharing things out fairly.', pos:[560,140], ringR:215, sections:[
    {id:'s1', num:'4.1', title:'What Multiplying Is',  emoji:'✖️'},
    {id:'s2', num:'4.2', title:'What Dividing Is',     emoji:'➗'},
    {id:'s3', num:'4.3', title:'Lines & Ramps',        emoji:'📈'},
    {id:'s4', num:'4.4', title:'Wheels, Pizza & Coins',emoji:'🌍'}
  ]},
  {chNum:5, id:'exproot', label:'Exponents & Square Roots', short:'Powers · Roots', emoji:'🚀', color:'#F5A623',
   desc:'Numbers that grow super fast — and how to shrink them back.', pos:[-560,-460], ringR:215, sections:[
    {id:'s1', num:'5.1', title:'What Powers Are',      emoji:'🚀'},
    {id:'s2', num:'5.2', title:'Square Roots',         emoji:'🌱'},
    {id:'s3', num:'5.3', title:'The Rocket Curve',     emoji:'📈'},
    {id:'s4', num:'5.4', title:'Folding, Tiles & Germs',emoji:'🌍'}
  ]},
  {chNum:6, id:'calc',    label:'Derivatives & Integrals', short:'Change · Adding up', emoji:'🎢', color:'#E8503A',
   desc:'The math of change: how fast things move, and adding tiny pieces.', pos:[520,-950], ringR:215, sections:[
    {id:'s1', num:'6.1', title:'How Fast Things Change', emoji:'⛰️'},
    {id:'s2', num:'6.2', title:'Adding Tiny Pieces',     emoji:'🌧️'},
    {id:'s3', num:'6.3', title:'Slopes & Areas',         emoji:'📐'},
    {id:'s4', num:'6.4', title:"Zoomy's Dashboard",      emoji:'🚗'}
  ]}
];
/* build node list */
const nodes=[];
const mathRoot={kind:'root', id:'mathRoot', label:'MATH', emoji:'🌱', color:'#8ED081', pos:[0,1150], r:95};
nodes.push(mathRoot);
const ghostCh1={kind:'ghost', id:'gCh1', label:'Ch 1 · Counting (soon)',    emoji:'🔢', color:'#8ED081', pos:[640,1030], r:60};
const ghostCh2={kind:'ghost', id:'gCh2', label:'Ch 2 · Place Value (soon)', emoji:'💯', color:'#8ED081', pos:[-660,1010], r:60};
nodes.push(ghostCh1, ghostCh2);
TOPICS.forEach(t=>{
  const tn={kind:'topic', id:t.id, topic:t, label:t.label, emoji:t.emoji, color:t.color, pos:t.pos, r:88};
  nodes.push(tn); t.node=tn;
  const N=t.sections.length;

function makeGraph(scene,opt){

  const Y=v=>opt.y+opt.h-(v-opt.ymin)/(opt.ymax-opt.ymin)*opt.h;
  for(let vx=opt.xmin;vx<=opt.xmax+1e-9;vx+=opt.xstep){
    E('line',{x1:X(vx),y1:opt.y,x2:X(vx),y2:opt.y+opt.h,stroke:'#E7DFC8','stroke-width':2},g);
  }

  }

  G.numbers();
  /* machine */
  E('rect',{x:30,y:150,width:170,height:150,rx:20,fill:'var(--fuel)',stroke:'var(--ink)','stroke-width':6},scene);
  label(scene,115,235,54,'#7a4c00','+3');
  label(scene,115,130,22,'#a06a2c','the add machine');
  const inTxt=label(scene,115,190,30,'#7a4c00','x = ?');
  const dots=[]; let lineDrawn=false;
  const sl=api.slider(0,8,2);
  const feed=api.button('🍬 Drop it in!','go');
  const slLbl=api.button('x = 2','ghost'); slLbl.style.pointerEvents='none';
  sl.addEventListener('input',()=>{ slLbl.textContent='x = '+sl.value; inTxt.textContent='x = '+sl.value; });
  feed.addEventListener('click',()=>{
    const x=+sl.value, y=x+3;
    if(dots.some(d=>d.x===x)){ S.thud(); api.setKid('Already dropped '+x+' in! Try a different number.'); return; }
    S.pop();
    const dot=E('circle',{cx:G.X(x),cy:G.Y(y),r:0,fill:'var(--car)',stroke:'var(--ink)','stroke-width':4},scene);
    dot.style.transition='r .4s'; setTimeout(()=>dot.setAttribute('r',11),30);
    label(scene,G.X(x),G.Y(y)-20,20,'var(--car-dark)',x+'+3='+y);
    dots.push({x:x,y:y});
    api.setKid(x+' went in… <span style="color:var(--fuel)">'+y+'</span> came out! ('+dots.length+' dot'+(dots.length>1?'s':'')+')');
    if(dots.length>=3&&!lineDrawn){
      lineDrawn=true;
      setTimeout(()=>{
        const p=G.path(v=>v+3,{stroke:'var(--go)','stroke-width':6,'stroke-dasharray':'2 0'});
        api.drawIn(p,1100); S.ding();
        api.setKid('Look! The dots make a perfectly <span style="color:var(--go)">straight line!</span>');
      },600);
    }
  });
}
},

kid:'Adding lifts the line <span style="color:var(--go)">UP</span> — subtracting sinks it down!',

{

{
kid:'The bathtub is a big adding machine!',
closer:'The faucet <b>adds</b> water, the drain <b>subtracts</b> it. The water level is the running total of everything that flowed in and out. (Remember this tub — it comes back when we learn integrals!)',
build(scene,api){
  E('rect',{width:900,height:480,fill:'#E8F6FF'},scene);
  E('rect',{x:200,y:120,width:500,height:300,rx:34,fill:'#fff',stroke:'var(--ink)','stroke-width':7},scene);

  const duck=E('text',{x:450,y:410,'font-size':46,'text-anchor':'middle',text:'🦆'},scene);
  E('rect',{x:640,y:60,width:16,height:70,fill:'var(--metal)',stroke:'var(--ink)','stroke-width':4},scene);
  E('rect',{x:600,y:50,width:96,height:26,rx:10,fill:'var(--metal)',stroke:'var(--ink)','stroke-width':4},scene);

      else if(drain&&!tap) api.setKid('Water OUT — subtracting it back <span style="color:var(--boom)">down!</span>');

function wrapText(g,txt,cx,y0,size,maxChars){
  g.innerHTML='';
  const words=String(txt).split(' '); const lines=[]; let line='';
  words.forEach(w=>{ if((line+' '+w).trim().length>maxChars){ lines.push(line.trim()); line=w; } else line+=' '+w; });
  if(line.trim()) lines.push(line.trim());
  lines.forEach((l,i)=>label(g,cx,y0+i*(size*1.3),size,'var(--ink)',l));
}
function shuffle(a){ return a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(p=>p[1]); }
/* ---- generic Try It quiz stage ---- */
quizStage=function(secNum,questions){
return {
kid:'Try It '+secNum+'! ⭐',
closer:'Tap the answer you think is right — wrong guesses are how brains grow! Tap 🧑‍🏫 any time to hear the question read aloud, or ❓ to ask about the idea.',
build(scene,api){
  E('rect',{width:900,height:480,fill:'#FFF9EF'},scene);
  E('rect',{x:70,y:90,width:760,height:280,rx:24,fill:'#fff',stroke:'var(--ink)','stroke-width':5},scene);
  const qNum=label(scene,450,60,28,'#a06a2c','');
  const qTxt=E('g',{},scene);
  const fb=label(scene,450,430,30,'var(--go-dark)','');
  const art=E('text',{x:450,y:330,'font-size':84,'text-anchor':'middle',text:'🤔'},scene);
  let qi=0, alive=true;
  api.onCleanup(()=>{ alive=false; });
  function renderQ(){
    const q=questions[qi];
    qNum.textContent='Question '+(qi+1)+' of '+questions.length;
    wrapText(qTxt,q.q,450,150,30,46);
    fb.textContent=''; art.textContent='🤔';
    const row=document.getElementById('controlsRow');
    row.innerHTML='';
    shuffle([...q.choices]).forEach(c=>{
      const b=api.button(String(c),'blue');
      b.addEventListener('click',()=>{
        if(String(c)===String(q.a)){
          S.ding(); art.textContent='🎉'; fb.textContent='✓ '+(q.why||'Correct!');
          api.setKid('YES! '+(q.why||''));
          [...row.children].forEach(x=>x.disabled=true);
          setTimeout(()=>{ if(!alive) return; qi++; if(qi<questions.length) renderQ(); else finish(); },1700);
        } else {
          S.thud(); b.style.opacity=.35; art.textContent='🙈';
          fb.textContent='Not quite — look again!';
        }
      });
    });
    api.setKid(q.q);
  }
  function finish(){
    S.tada(); art.textContent='🏆'; qNum.textContent='';
    wrapText(qTxt,'All '+questions.length+' solved — amazing!',450,180,38,26);
    fb.textContent='';
    document.getElementById('controlsRow').innerHTML='';
    api.setKid('Try It '+secNum+' complete! 🏆 Tap Finish ⭐ for your star!');
  }
  renderQ();
}
};

const st_balance={
kid:'The <span style="color:var(--fuel)">=</span> sign is a balance, not "the answer goes here"!',
closer:'= means "both sides are the SAME AMOUNT". That\'s why 5 = 3 + 2 and 4 + 1 = 3 + 2 are perfectly true sentences. If you think of = as level scale pans, you\'ll never be confused.',
build(scene,api){
  E('rect',{width:900,height:480,fill:'#F3EEFB'},scene);
  const eq=label(scene,450,60,44,'var(--ink)','0 vs 0');
  E('path',{d:'M 410 420 L 490 420 L 450 330 Z',fill:'var(--metal)',stroke:'var(--ink)','stroke-width':5},scene);
  const beamG=E('g',{},scene);
  beamG.style.transformOrigin='450px 330px';
  beamG.style.transition='transform .6s cubic-bezier(.3,1.3,.4,1)';
  E('line',{x1:190,y1:330,x2:710,y2:330,stroke:'var(--ink)','stroke-width':10,'stroke-linecap':'round'},beamG);
  const panL=E('g',{},beamG), panR=E('g',{},beamG);
  E('path',{d:'M 150 350 Q 210 400 270 350',fill:'#C9D3E0',stroke:'var(--ink)','stroke-width':5},panL);
  E('path',{d:'M 630 350 Q 690 400 750 350',fill:'#C9D3E0',stroke:'var(--ink)','stroke-width':5},panR);
  const blocksL=E('g',{},panL), blocksR=E('g',{},panR);
  let L=0,R=0,balancedAt=0;
  function draw(){
    blocksL.innerHTML=''; blocksR.innerHTML='';
    for(let i=0;i<L;i++) E('rect',{x:180+(i%3)*32,y:318-Math.floor(i/3)*32,width:28,height:28,rx:6,fill:'var(--car)',stroke:'var(--ink)','stroke-width':3},blocksL);
    for(let i=0;i<R;i++) E('rect',{x:660+(i%3)*32,y:318-Math.floor(i/3)*32,width:28,height:28,rx:6,fill:'var(--blue)',stroke:'var(--ink)','stroke-width':3},blocksR);
    const tilt=Math.max(-14,Math.min(14,(L-R)*5));
    beamG.style.transform='rotate('+(-tilt)+'deg)';
    if(L===R&&L>0){
      eq.textContent=L+' = '+R+'  — LEVEL!';
      api.setKid('Level! <span style="color:var(--go)">'+L+' = '+R+'</span> — both sides are the same amount!');
      if(balancedAt!==L){ balancedAt=L; S.ding(); }
    } else {
      eq.textContent=L+' vs '+R;
      if(L+R>0) api.setKid((L>R?'Left':'Right')+' side is heavier — the = sign would NOT be true yet!');
    }
  }
  draw();
  const bl=api.button('+1 🟥 left',''), br=api.button('+1 🟦 right','blue'), rs=api.button('🔄','ghost');
  bl.addEventListener('click',()=>{ if(L>=9){S.thud();return;} L++; S.pop(); draw(); });
  br.addEventListener('click',()=>{ if(R>=9){S.thud();return;} R++; S.pop(); draw(); });
  rs.addEventListener('click',()=>{ L=0;R=0;balancedAt=0; S.pop(); draw();
    api.setKid('The <span style="color:var(--fuel)">=</span> sign is a balance, not "the answer goes here"!'); });
}
};
/* ---- 3.2 stage: the flip train (VISUAL 3.3) ---- */
const st_train={
kid:'Flip the train — <span style="color:var(--blue)">same length!</span>',
closer:'2 + 7 and 7 + 2 are the SAME train turned around — that\'s the commutative property. Why care? Speed! Counting on from the bigger number (8, 9!) beats counting on from the smaller one every time.',
build(scene,api){
  E('rect',{width:900,height:480,fill:'#E8F6FF'},scene);
  const eq=label(scene,450,70,48,'var(--ink)','2 + 7 = 9');
  let a=2,b=7,flipped=false;
  const trainG=E('g',{},scene);
  trainG.style.transformOrigin='450px 270px';
  trainG.style.transition='transform .7s cubic-bezier(.3,1.2,.4,1)';
  function draw(){
    trainG.innerHTML='';
    const n=a+b, cw=Math.min(64,600/n);

    E('line',{x1:x0-12,y1:180,x2:x0-12,y2:360,stroke:'#7c8ba8','stroke-width':4,'stroke-dasharray':'10 8'},scene);

    const order=flipped?[['var(--blue)',b],['var(--car)',a]]:[['var(--car)',a],['var(--blue)',b]];
    let i=0;
    order.forEach(([col,cnt])=>{
      for(let k=0;k<cnt;k++){
        E('rect',{x:x0+i*cw+3,y:240,width:cw-6,height:cw-6,rx:8,fill:col,stroke:'var(--ink)','stroke-width':4},trainG);

        i++;
      }
    });
    eq.textContent=flipped?(b+' + '+a+' = '+n):(a+' + '+b+' = '+n);

  draw();
  const fl=api.button('🔄 FLIP the train!','go'), add=api.button('+ 🟦','ghost');

    setTimeout(()=>{
      flipped=!flipped;

      draw();
      setTimeout(()=>{ trainG.style.transition='transform .7s cubic-bezier(.3,1.2,.4,1)'; },30);

      api.setKid('Same train, same <span style="color:var(--blue)">'+(a+b)+'</span> — just turned around! '+(flipped?b+' + '+a:a+' + '+b)+' works both ways.');

/* ---------------- DERIVATIVES & INTEGRALS ---------------- */
(function(){
const TXT={ 'font-family':'Baloo 2','font-weight':800 };
function label(scene,x,y,size,fill,str,anchor){
  return E('text',Object.assign({x:x,y:y,'font-size':size,fill:fill||'var(--ink)','text-anchor':anchor||'middle'},TXT,{text:str}),scene);
}
function gauge(scene,cx,cy,r,title){
  E('path',{d:'M '+(cx-r)+' '+cy+' A '+r+' '+r+' 0 0 1 '+(cx+r)+' '+cy,fill:'none',stroke:'var(--ink)','stroke-width':7},scene);
  E('path',{d:'M '+(cx-r)+' '+cy+' L '+(cx+r)+' '+cy,stroke:'var(--ink)','stroke-width':7},scene);
  for(let i=0;i<=6;i++){
    const a=Math.PI-(i/6)*Math.PI;
    E('line',{x1:cx+Math.cos(a)*(r-4),y1:cy-Math.sin(a)*(r-4),x2:cx+Math.cos(a)*(r-16),y2:cy-Math.sin(a)*(r-16),stroke:'var(--ink)','stroke-width':4},scene);
  }
  const needle=E('line',{x1:cx,y1:cy,x2:cx-r+22,y2:cy,stroke:'var(--car)','stroke-width':7,'stroke-linecap':'round'},scene);
  E('circle',{cx:cx,cy:cy,r:9,fill:'var(--ink)'},scene);
  label(scene,cx,cy+30,19,'#54607a',title);
  return {set(v01){ /* 0..1 */
    const a=Math.PI-Math.max(0,Math.min(1,v01))*Math.PI;
    needle.setAttribute('x2',cx+Math.cos(a)*(r-22));
    needle.setAttribute('y2',cy-Math.sin(a)*(r-22));
  }};
}
/* ======== CH 1 : NUMBERS (the two big ideas) ======== */
const C_num=[
{
kid:'The derivative asks: <span style="color:var(--car)">how steep is it RIGHT HERE?</span>',
closer:'Walk the three hills. Your height changes as you walk — <b>steepness is how fast your height changes per step</b>. Flat = 0. Gentle = a little per step. Steep = a lot per step! "Rate of change" is the whole idea of a derivative.',
build(scene,api){
  E('rect',{width:900,height:480,fill:'var(--sky)'},scene);
  E('rect',{y:400,width:900,height:80,fill:'var(--grass)'},scene);
  const hills=[
    {x0:40, w:240, h:0,  name:'FLAT',   col:'#8ED081', slope:0},
    {x0:330,w:240, h:90, name:'GENTLE', col:'#5FA65F', slope:1},
    {x0:620,w:240, h:210,name:'STEEP',  col:'#3E7A4A', slope:3}
  ];
  hills.forEach(h=>{
    E('path',{d:'M '+h.x0+' 400 L '+(h.x0+h.w)+' '+(400-h.h)+' L '+(h.x0+h.w)+' 400 Z',fill:h.col,stroke:'var(--ink)','stroke-width':4},scene);
    label(scene,h.x0+h.w/2,440,22,'#2c5c38',h.name);
  });
  const meter=gauge(scene,450,180,90,'steepness meter');
  const mVal=label(scene,450,140,34,'var(--car-dark)','—');
  const walker=E('text',{x:60,y:388,'font-size':44,'text-anchor':'middle',text:'🚶'},scene);
  let anim=null;
  hills.forEach((h,i)=>{
    const b=api.button(i===0?'🟩 Flat':(i===1?'⛰️ Gentle':'🏔️ Steep'), i===0?'ghost':(i===1?'blue':'boom'));
    b.addEventListener('click',()=>{
      if(anim) return;
      S.pop();
      const t0=performance.now();
      anim={h:h,t0:t0};
      meter.set(h.slope/3.5); mVal.textContent=h.slope+' up per step';
      api.setKid(h.slope===0?'Flat path: height change = <span style="color:var(--car)">0</span>. Easy stroll!':
        (h.slope===1?'Gentle hill: up <span style="color:var(--car)">1</span> for every step across.':'Steep hill: up <span style="color:var(--car)">3</span> every step — puff puff! 🥵'));
      api.onUpdate(()=>{
        if(!anim) return;
        const u=Math.min(1,(performance.now()-anim.t0)/2200);
        const x=anim.h.x0+u*anim.h.w;
        const y=400-u*anim.h.h;
        walker.setAttribute('x',x); walker.setAttribute('y',y-12);
        if(u>=1){ anim=null; if(h.slope===3) S.ding(); }
      });
    });
  });
}
},
{
kid:'The integral asks: <span style="color:var(--blue)">how much has piled up?</span>',
closer:'Each raindrop is tiny — almost nothing! But the bucket <b>adds every single drop</b>, and the total grows into something big. An integral is exactly that: adding up zillions of tiny pieces to get the whole amount.',
build(scene,api){
  E('rect',{width:900,height:480,fill:'#39466B'},scene);
  E('text',{x:450,y:96,'font-size':84,'text-anchor':'middle',text:'🌧️'},scene);
  E('path',{d:'M 330 200 L 570 200 L 540 430 L 360 430 Z',fill:'#C9D3E0',stroke:'var(--ink)','stroke-width':6},scene);
  const clip=E('clipPath',{id:'bkClip'},scene);
  E('path',{d:'M 334 204 L 566 204 L 537 427 L 363 427 Z'},clip);
  const water=E('rect',{x:330,y:430,width:240,height:0,fill:'#7EC8F0','clip-path':'url(#bkClip)'},scene);
  const total=label(scene,450,180,40,'#fff','0 drops');
  const dropsG=E('g',{},scene);
  let count=0, raining=false, dropT=0;
  const rb=api.button('🌧️ HOLD to rain!','blue');
  api.holdable(rb,()=>{raining=true;},()=>{raining=false;});
  api.onUpdate((dt)=>{
    dropT+=dt;
    if(raining && dropT>0.08){

      if(count>=185){ api.setKid('FULL! Tiny pieces + tiny pieces = <span style="color:var(--blue)">the whole bucket.</span> That\'s integrating!'); S.ding(); raining=false; }

},
{
kid:'Steps and staircases: they are <span style="color:var(--fuel)">opposites!</span>',
closer:'Look at a staircase two ways. Ask "how big is EACH step?" — that\'s the derivative. Ask "how high am I in TOTAL?" — that\'s the integral. Each one undoes the other, like + and −, like ² and √. Calculus is just both questions together!',
build(scene,api){
  E('rect',{width:900,height:480,fill:'#FFF3E0'},scene);
  const stepH=46,stepW=88,n=6;
  const stairsG=E('g',{},scene);
  for(let i=0;i<n;i++){
    E('rect',{x:150+i*stepW,y:420-(i+1)*stepH,width:stepW,height:(i+1)*stepH,fill:i%2?'#C88A4B':'#B57B40',stroke:'var(--ink)','stroke-width':4},stairsG);
  }
  const climber=E('text',{x:150+stepW/2,y:420-stepH-12,'font-size':44,'text-anchor':'middle',text:'🧗'},scene);
  const stepTag=label(scene,450,70,34,'var(--car-dark)','each step: +46 high');
  const totTag=label(scene,450,114,34,'#33689c','total height: 46');
  const marksG=E('g',{},scene);
  let pos=0;
  function refresh(){
    marksG.innerHTML='';
    E('path',{d:'M '+(150+pos*stepW+stepW-14)+' '+(420-pos*stepH)+' l 0 '+(-stepH),stroke:'var(--car)','stroke-width':6,'stroke-linecap':'round'},marksG);
    E('path',{d:'M 120 420 L 120 '+(420-(pos+1)*stepH),stroke:'var(--blue)','stroke-width':8,'stroke-linecap':'round'},marksG);
    E('text',{x:104,y:420-(pos+1)*stepH/2,'font-size':22,'text-anchor':'middle','font-family':'Baloo 2','font-weight':800,fill:'#33689c',text:(pos+1)*stepH},marksG);
    stepTag.textContent='DERIVATIVE view: each step = +'+stepH;
    totTag.textContent='INTEGRAL view: total height = '+((pos+1)*stepH);
    climber.setAttribute('x',150+pos*stepW+stepW/2);
    climber.setAttribute('y',420-(pos+1)*stepH-12);
  }
  refresh();
  const up=api.button('⬆️ Climb a step','go'), dn=api.button('⬇️ Step down','boom');
  up.addEventListener('click',()=>{
    if(pos>=n-1){ S.thud(); return; }
    pos++; S.pop(); refresh();
    api.setKid('Step size +'+stepH+' (derivative) … total now <span style="color:var(--blue)">'+((pos+1)*stepH)+'</span> (integral)!');
  });
  dn.addEventListener('click',()=>{
    if(pos<=0){ S.thud(); return; }
    pos--; S.pop(); refresh();
    api.setKid('Going down subtracts a step — the total shrinks back. <span style="color:var(--fuel)">Opposites!</span>');
  });
}
}];
/* ======== CH 2 : ON A GRAPH ======== */
const C_graph=[
{
kid:'Steepness ruler! Can you find where the slope is exactly <span style="color:var(--go)">0</span>?',
closer:'Slide the hiker along the hill. The red <b>tangent line</b> touches the curve at one point and shows the slope right there — that number IS the derivative. Uphill = positive, downhill = negative… and somewhere there\'s a magic spot where it\'s exactly <b>zero</b>. Find it!',
build(scene,api){
  const G=api.graph({x:190,y:40,w:560,h:380,xmin:0,xmax:10,ymin:0,ymax:10,xlabel:'walk →',ylabel:'height'});
  const f=x=>8-Math.pow(x-5,2)/3.2;
  const fp=x=>-2*(x-5)/3.2;
  const curve=G.path(f,{stroke:'var(--go)','stroke-width':7},0.5,9.5);
  api.drawIn(curve,900);
  const tan=E('line',{x1:0,y1:0,x2:0,y2:0,stroke:'var(--car)','stroke-width':6,'stroke-linecap':'round'},scene);
  const hiker=E('text',{x:0,y:0,'font-size':38,'text-anchor':'middle',text:'🥾'},scene);
  const tag=label(scene,450,36,32,'var(--car-dark)','slope = ?');
  let foundTop=false;
  function setX(x){
    const y=f(x), m=fp(x);
    const px=G.X(x), py=G.Y(y);
    const dxw=1.6;
    tan.setAttribute('x1',G.X(x-dxw)); tan.setAttribute('y1',G.Y(y-m*dxw));
    tan.setAttribute('x2',G.X(x+dxw)); tan.setAttribute('y2',G.Y(y+m*dxw));
    hiker.setAttribute('x',px); hiker.setAttribute('y',py-10);
    const mv=Math.round(m*10)/10;
    tag.textContent='slope = '+mv;
    if(Math.abs(mv)<0.15){ tag.setAttribute('fill','var(--go-dark)');
      if(!foundTop){ foundTop=true; S.tada(); }
      api.setKid('🎯 The TOP! Slope = <span style="color:var(--go)">0</span> — for one instant, not going up or down!'); }
    else if(mv>0){ tag.setAttribute('fill','var(--car-dark)');
      api.setKid('Climbing! Slope +'+mv+' — height is growing.'); }
    else { tag.setAttribute('fill','#b34e00');
      api.setKid('Downhill! Slope '+mv+' — height is shrinking. Wheee!'); }
  }
  setX(2);
  const sl=api.slider(0.5,9.5,2,0.1);
  sl.addEventListener('input',()=>{ setX(+sl.value); S.whir(); });
}
},
{
kid:'Thin slices magically become <span style="color:var(--blue)">smooth area!</span>',
closer:'We want the area under the curve — but it\'s curvy! Trick: fill it with rectangles and ADD them up. Chunky rectangles are a rough guess… but the thinner they get, the closer the sum comes to the true area. Infinitely thin = the exact <b>integral</b>!',
build(scene,api){
  const G=api.graph({x:190,y:40,w:560,h:380,xmin:0,xmax:8,ymin:0,ymax:10,xlabel:'x',ylabel:'y'});
  const f=x=>1.5+x*x/9;
  const rectsG=E('g',{},scene);
  const curve=G.path(f,{stroke:'var(--go)','stroke-width':7});
  const tag=label(scene,450,36,30,'#33689c','');
  const exact=(v=>1.5*8+Math.pow(8,3)/27)();
  let n=2;
  function draw(){
    rectsG.innerHTML='';
    const w=8/n; let sum=0;
    for(let i=0;i<n;i++){
      const xm=i*w+w/2, h=f(xm); sum+=h*w;
      E('rect',{x:G.X(i*w)+1,y:G.Y(h),width:G.X(w)-G.X(0)-2,height:G.Y(0)-G.Y(h),
        fill:'rgba(95,168,232,.55)',stroke:'#33689c','stroke-width':2},rectsG);
    }
    tag.textContent=n+' slices → area ≈ '+sum.toFixed(1)+'   (true: '+exact.toFixed(1)+')';
    return sum;
  }
  draw();
  const sl=api.slider(2,40,2,1);
  const lbl=api.button('2 slices','ghost'); lbl.style.pointerEvents='none';
  sl.addEventListener('input',()=>{
    n=+sl.value; lbl.textContent=n+' slices';
    const sum=draw(); S.whir();
    const off=Math.abs(sum-exact);
    api.setKid(n<6?'Chunky slices — close-ish, but gaps stick out!':(n<20?'Thinner slices hug the curve better…':'So thin it\'s nearly <span style="color:var(--blue)">perfect</span> — off by only '+off.toFixed(2)+'!'));
    if(n>=40) S.ding();
  });
}
},
{
kid:'Area under SPEED = <span style="color:var(--fuel)">distance traveled!</span>',
closer:'Here\'s the magic bridge between the two ideas. Zoomy drives at a steady 3 for t seconds. The graph makes a rectangle: 3 tall, t wide → area = 3 × t… which is EXACTLY how far Zoomy went! Area under the speed curve is always the distance.',
build(scene,api){
  E('rect',{width:900,height:480,fill:'var(--sky)'},scene);
  /* road strip on top */
  E('rect',{y:60,width:900,height:60,fill:'var(--road)'},scene);
  E('line',{x1:0,y1:90,x2:900,y2:90,stroke:'var(--stripe)','stroke-width':5,'stroke-dasharray':'28 24'},scene);
  const car=E('text',{x:70,y:105,'font-size':40,'text-anchor':'middle',text:'🚗'},scene);
  const dTag=label(scene,780,50,26,'var(--ink)','distance: 0');
  const G=api.graph({x:190,y:170,w:560,h:260,xmin:0,xmax:8,ymin:0,ymax:5,xlabel:'time (s)',ylabel:'speed'});
  G.numbers();
  const area=E('rect',{x:G.X(0),y:G.Y(3),width:0,height:G.Y(0)-G.Y(3),fill:'rgba(245,166,35,.5)',stroke:'#c77f00','stroke-width':3},scene);
  G.path(v=>3,{stroke:'var(--car)','stroke-width':7});
  label(scene,G.X(7.2),G.Y(3)-14,22,'var(--car-dark)','speed = 3');
  const aTag=label(scene,G.X(2),G.Y(1.4),30,'#7a4c00','');
  const sl=api.slider(0,8,0,0.5);
  const lbl=api.button('t = 0 s','ghost'); lbl.style.pointerEvents='none';
  sl.addEventListener('input',()=>{
    const t=+sl.value;
    lbl.textContent='t = '+t+' s';
    area.setAttribute('width',G.X(t)-G.X(0));
    aTag.textContent=t>0?('area = 3 × '+t+' = '+(3*t)):'';
    aTag.setAttribute('x',G.X(Math.max(1.4,t/2)));
    car.setAttribute('x',70+(3*t)/24*760);
    dTag.textContent='distance: '+(3*t);
    S.whir();
    api.setKid(t===0?'Slide time forward and watch the rectangle grow!':'After '+t+'s: rectangle area = <span style="color:var(--fuel)">'+(3*t)+'</span> = exactly Zoomy\'s distance!');
    if(t>=8){ S.honk(); }
  });
}
}];

build(scene,api){

      S.pop();
    }
    if(dist>0&&speed<0.1) api.setKid('Stopped — but the odometer <span style="color:var(--blue)">remembers every piece</span>. Integrals never forget!');
    else if(speed>0.3) api.setKid('Every moment adds a tiny "+bit" of road… the total only grows!');
  });
}
},
{
kid:'One drive, both ideas: <span style="color:var(--car)">slope</span> and <span style="color:var(--blue)">area</span> together!',
closer:'Drive and watch both graphs draw themselves. The <b>distance</b> curve is steep exactly when <b>speed</b> is high — speed is the slope of distance (derivative). And distance is the area piling up under speed (integral). Two views, one drive. That\'s calculus!',
build(scene,api){
  E('rect',{width:900,height:480,fill:'#F2EEE4'},scene);
  const GL=api.graph({x:80,y:80,w:340,h:300,xmin:0,xmax:12,ymin:0,ymax:6,xlabel:'time',ylabel:'SPEED',xstep:2});
  const GR=api.graph({x:520,y:80,w:340,h:300,xmin:0,xmax:12,ymin:0,ymax:220,xlabel:'time',ylabel:'DISTANCE',xstep:2,ystep:44});
  label(scene,250,50,26,'var(--car-dark)','speed (derivative view)');
  label(scene,690,50,26,'#33689c','distance (integral view)');
  const areaG=E('g',{},scene);
  const spPath=E('path',{fill:'none',stroke:'var(--car)','stroke-width':5,'stroke-linecap':'round'},scene);
  const dsPath=E('path',{fill:'none',stroke:'var(--blue)','stroke-width':5,'stroke-linecap':'round'},scene);
  let t=0,speed=0,dist=0,pedal=false,done=false;
  let dSp='',dDs='',fillT=0;
  const pb=api.button('🦶 HOLD & release — make hills!','go');
  const rb=api.button('🔄 Again','ghost');
  api.holdable(pb,()=>{pedal=true;},()=>{pedal=false;});
  function reset(){ t=0;speed=0;dist=0;done=false;dSp='';dDs='';areaG.innerHTML='';
    spPath.setAttribute('d',''); dsPath.setAttribute('d','');
    api.setKid('One drive, both ideas: <span style="color:var(--car)">slope</span> and <span style="color:var(--blue)">area</span> together!'); }
  rb.addEventListener('click',()=>{ S.pop(); reset(); });
  api.onUpdate((dt)=>{
    if(done) return;
    speed+=((pedal?5:0)-speed)*Math.min(1,dt*2);
    t+=dt; dist+=speed*dt*3.2;
    if(t>=12){ done=true; S.tada();
      api.setKid('Beautiful! Steep <span style="color:var(--blue)">distance</span> exactly where <span style="color:var(--car)">speed</span> was high. You just SAW calculus!');
      return; }
    const sx=GL.X(t), sy=GL.Y(Math.min(6,speed));
    const dx=GR.X(t), dy=GR.Y(Math.min(220,dist));
    dSp+=(dSp?' L ':'M ')+sx.toFixed(1)+' '+sy.toFixed(1);
    dDs+=(dDs?' L ':'M ')+dx.toFixed(1)+' '+dy.toFixed(1);
    spPath.setAttribute('d',dSp);
    dsPath.setAttribute('d',dDs);
    fillT+=dt;
    if(fillT>0.22){
      fillT=0;
      E('rect',{x:sx-3,y:sy,width:6,height:GL.Y(0)-sy,fill:'rgba(232,80,58,.25)'},areaG);
      if(pedal) S.whir();
    }
  });
}
}];
/* ---- 6.1 stage: average speed sneaks up on right-now speed (secant → tangent) ---- */
const st_secant={
kid:'Shrink the gap — <span style="color:var(--car)">average</span> becomes <span style="color:var(--go)">right now!</span>',
closer:'The orange line measures AVERAGE steepness between two points on the hill. Slide them closer and closer… the average sneaks up on the steepness at ONE point. Mathematicians call this sneaking-up a <b>limit</b> — and it\'s the exact idea behind every derivative.',
build(scene,api){
  const G=api.graph({x:190,y:40,w:560,h:380,xmin:0,xmax:10,ymin:0,ymax:10,xlabel:'walk →',ylabel:'height'});
  const f=x=>8-Math.pow(x-5,2)/3.2;
  const curve=G.path(f,{stroke:'var(--go)','stroke-width':7},0.5,9.5);
  api.drawIn(curve,800);
  const a=3;
  const dotA=E('circle',{cx:G.X(a),cy:G.Y(f(a)),r:11,fill:'var(--spark)',stroke:'var(--ink)','stroke-width':4},scene);
  const dotB=E('circle',{cx:0,cy:0,r:11,fill:'var(--boom)',stroke:'var(--ink)','stroke-width':4},scene);
  const sec=E('line',{stroke:'var(--fuel)','stroke-width':6,'stroke-linecap':'round'},scene);
  const tag=label(scene,450,24,26,'#b34e00','');
  let celebrated=false;
  function setH(h){
    const b=a+h;
    const m=(f(b)-f(a))/h;
    const dxw=2.2;
    sec.setAttribute('x1',G.X(a-dxw)); sec.setAttribute('y1',G.Y(f(a)-m*dxw));
    sec.setAttribute('x2',G.X(b+dxw)); sec.setAttribute('y2',G.Y(f(b)+m*dxw));
    dotB.setAttribute('cx',G.X(b)); dotB.setAttribute('cy',G.Y(f(b)));
    const mv=Math.round(m*100)/100;
    tag.textContent='gap = '+h.toFixed(1)+'  →  average slope = '+mv;
    if(h<=0.31){
      tag.setAttribute('fill','var(--go-dark)');
      api.setKid('Gap almost <b>zero</b>: average slope '+mv+' ≈ the <span style="color:var(--go)">right-now slope</span> at the yellow dot!');
      if(!celebrated){ celebrated=true; S.tada(); }
    } else {
      tag.setAttribute('fill','#b34e00');
      api.setKid('Two points, gap '+h.toFixed(1)+': the orange line is the <span style="color:var(--car)">average</span> between them. Shrink it!');
    }
  }
  setH(4);
  const sl=api.slider(0.3,4,4,0.1);
  const lbl=api.button('gap = 4','ghost'); lbl.style.pointerEvents='none';
  sl.addEventListener('input',()=>{ const h=+sl.value; lbl.textContent='gap = '+h.toFixed(1); S.whir(); setH(h); });
}
};
registerLesson('calc',[
{stages:[C_num[0], st_secant, quizStage('6.1',[
  {q:'Slope 0 at a spot means…?',choices:['flat right there','going up','falling fast'],a:'flat right there',why:'The very top of a hill is flat for one instant!'},
  {q:'The speedometer shows…?',choices:['right-now speed','total distance','yesterday\'s speed'],a:'right-now speed',why:'A live derivative — how fast position changes THIS moment.'},
  {q:'Shrinking the gap between two points makes the average slope…?',choices:['sneak up on the right-now slope','disappear','get steeper forever'],a:'sneak up on the right-now slope',why:'That sneaking-up is called a limit — the heart of calculus!'}
])], qa:[
  {q:'What IS a derivative, really?', a:'It is the answer to "how fast is this changing right now?" The steepness of the hill under your feet, the speed on the dial this second. Not the total, not the past — the rate of change at this very moment.'},
  {q:'What is a limit?', a:'A sneak-up! You cannot divide by a gap of zero, but you can shrink the gap smaller and smaller and watch the answer settle down. The number it settles on is the limit — and that settled number is the derivative.'}
]},
{stages:[C_num[1], C_num[2], quizStage('6.2',[
  {q:'The odometer in a car…?',choices:['adds up every bit of road','shows right-now speed','counts the wheels'],a:'adds up every bit of road',why:'A patient integral — tiny pieces, one giant total.'},
  {q:'A total built from zillions of tiny pieces is called…?',choices:['an integral','a derivative','a remainder'],a:'an integral',why:'Raindrops → bucket. Steps → height. Pieces → whole!'},
  {q:'Each stair step is +20 high. After 4 steps, total height?',choices:[60,80,100],a:80,why:'4 × 20 = 80 — the integral of equal steps is just multiplying!'}
])], qa:[
  {q:'What IS an integral, really?', a:'It is the answer to "how much has piled up in total?" Add up every raindrop, every tiny step, every little bit — the integral is the grand total that all the tiny pieces build.'},
  {q:'Why are derivative and integral opposites?', a:'Look at the staircase both ways. The size of each step is the derivative. The height you have climbed is the integral. If you know every step you can find the height, and if you watch the height you can find each step.'}
]},
{stages:C_graph, qa:[
  {q:'What is a tangent line?', a:'A straight line that just kisses the curve at one single point, leaning exactly the way the curve leans right there. Its tilt IS the derivative at that point — a tiny steepness ruler.'},
  {q:'Why do thinner slices work better?', a:'A fat rectangle pokes out past the curve or leaves gaps under it. Thin ones hug the curve tighter, so the error shrinks. Make them thinner forever and the error melts away to nothing — that limit is the exact integral.'},
  {q:'Why does area equal distance?', a:'The rectangle under the speed line is height times width — and that is speed times time, which is exactly distance! It works for bumpy speeds too: pile up thin slices of speed-times-a-moment and you get the whole trip.'}
]},
{stages:C_world, qa:[
  {q:'Does my car really do calculus?', a:'It truly does! The speedometer measures how fast your position is changing right now — a live derivative. The odometer adds up every little bit of road forever — a patient integral. Two dials, two halves of calculus.'},
  {q:'Where else does this show up?', a:'Your heart: beats per minute is a rate, total heartbeats is an integral. Rain: how hard it falls versus how full the bucket gets. Your phone battery: how fast it drains versus how much is left. Change and total — always in pairs.'}
]}]);
})();
